<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Live GitHub engineering metrics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360">
      <stop stop-color="#07111F"/>
      <stop offset=".62" stop-color="#09192A"/>
      <stop offset="1" stop-color="#0B202C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#58A6FF"/>
      <stop offset=".52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16304B" stroke-width="1" opacity=".32"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { font: 700 22px Inter, Segoe UI, Arial, sans-serif; fill: #F4F8FC; }
      .eyebrow { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; fill: #58A6FF; }
      .metric-value { font: 700 31px Inter, Segoe UI, Arial, sans-serif; fill: #F7FAFD; }
      .metric-label { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.4px; fill: #7E96AD; }
      .signal { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #DDEAF5; }
      .small { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7891A9; }
      .lang-name { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #A9BDD0; }
      .lang-bar { fill: url(#accent); }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 6s linear infinite; }
      @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes scan { from { transform: translateX(-280px) } to { transform: translateX(1280px) } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .scan { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#223A53"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <g class="scan" opacity=".42">
    <rect x="-210" y="0" width="210" height="360" fill="url(#accent)" opacity=".05"/>
    <line x1="0" y1="16" x2="0" y2="344" stroke="#22D3EE" stroke-width="1"/>
  </g>

  <text x="58" y="49" class="eyebrow">LIVE / ENGINEERING TELEMETRY</text>
  <text x="58" y="80" class="title">GitHub signal, rendered by this repository</text>

  
      <g transform="translate(58 105)">
        <text class="metric-value" y="0">19</text>
        <text class="metric-label" y="29">PUBLIC REPOS</text>
      </g>
      <g transform="translate(263 105)">
        <text class="metric-value" y="0">8</text>
        <text class="metric-label" y="29">FOLLOWERS</text>
      </g>
      <g transform="translate(468 105)">
        <text class="metric-value" y="0">2</text>
        <text class="metric-label" y="29">STARS</text>
      </g>
      <g transform="translate(673 105)">
        <text class="metric-value" y="0">2.5K</text>
        <text class="metric-label" y="29">CONTRIBUTIONS</text>
      </g>

  <line x1="58" y1="171" x2="1142" y2="171" stroke="#1D344A"/>

  <g transform="translate(58 207)">
    <circle cx="5" cy="4" r="5" fill="#3FB950" class="pulse"/>
    <text x="21" y="9" class="eyebrow" fill="#3FB950">CURRENT SIGNAL</text>
    <text x="0" y="51" class="signal">love-sense-ai</text>
    <text x="0" y="76" class="small">last public push · 06 Sept 2026</text>

    <text x="0" y="125" class="small">source · graphql</text>
    <text x="165" y="125" class="small">forks · 0</text>
    <text x="285" y="125" class="small">28d contributions · 152</text>
  </g>

  <text x="890" y="198" class="eyebrow">LANGUAGE FOOTPRINT</text>
  
      <g>
        <text x="890" y="218" class="lang-name">JavaScript</text>
        <rect x="1003" y="207" width="145" height="8" rx="4" fill="#15263A"/>
        <rect x="1003" y="207" width="92" height="8" rx="4" class="lang-bar">
          <animate attributeName="width" from="0" to="92" dur="0.55s" fill="freeze"/>
        </rect>
      </g>
      <g>
        <text x="890" y="243" class="lang-name">C#</text>
        <rect x="1003" y="232" width="145" height="8" rx="4" fill="#15263A"/>
        <rect x="1003" y="232" width="92" height="8" rx="4" class="lang-bar">
          <animate attributeName="width" from="0" to="92" dur="0.63s" fill="freeze"/>
        </rect>
      </g>
      <g>
        <text x="890" y="268" class="lang-name">Java</text>
        <rect x="1003" y="257" width="145" height="8" rx="4" fill="#15263A"/>
        <rect x="1003" y="257" width="55" height="8" rx="4" class="lang-bar">
          <animate attributeName="width" from="0" to="55" dur="0.7100000000000001s" fill="freeze"/>
        </rect>
      </g>
      <g>
        <text x="890" y="293" class="lang-name">HTML</text>
        <rect x="1003" y="282" width="145" height="8" rx="4" fill="#15263A"/>
        <rect x="1003" y="282" width="37" height="8" rx="4" class="lang-bar">
          <animate attributeName="width" from="0" to="37" dur="0.79s" fill="freeze"/>
        </rect>
      </g>
      <g>
        <text x="890" y="318" class="lang-name">TypeScript</text>
        <rect x="1003" y="307" width="145" height="8" rx="4" fill="#15263A"/>
        <rect x="1003" y="307" width="18" height="8" rx="4" class="lang-bar">
          <animate attributeName="width" from="0" to="18" dur="0.8700000000000001s" fill="freeze"/>
        </rect>
      </g>

  <path d="M816 193V327" stroke="#1D344A"/>
</svg>