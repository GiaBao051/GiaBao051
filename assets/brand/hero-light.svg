<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Trần Dương Gia Bảo Profile Header">
  <defs>
    <pattern id="heroGrid_light" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#E2E8F0" stroke-width="1" opacity="0.5"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .scan { animation: scanLine 8s linear infinite; }
      .pulse-dot { animation: beaconPulse 2.4s ease-in-out infinite; }
      .flow-dash { stroke-dasharray: 8 10; animation: flowDashAnim 4s linear infinite; }
      @keyframes scanLine {
        0% { transform: translateX(-240px); opacity: 0.1; }
        50% { opacity: 0.35; }
        100% { transform: translateX(1240px); opacity: 0.1; }
      }
      @keyframes beaconPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes flowDashAnim {
        to { stroke-dashoffset: -36; }
      }
      @media (prefers-reduced-motion: reduce) {
        .scan, .pulse-dot, .flow-dash { animation: none; }
      }
    </style>
  </defs>

  <!-- Frame Base -->
  <rect width="1200" height="400" rx="20" fill="#FFFFFF"/>
  <rect width="1200" height="400" rx="20" fill="url(#heroGrid_light)"/>
  <rect x="1" y="1" width="1198" height="398" rx="19" fill="none" stroke="#CBD5E1" stroke-width="1.8"/>

  <!-- Scanning Ray -->
  <g class="scan" opacity="0.3">
    <rect x="-180" y="0" width="180" height="400" fill="#0891B2" opacity="0.04"/>
    <line x1="0" y1="16" x2="0" y2="384" stroke="#0891B2" stroke-width="1.5"/>
  </g>

  <!-- Top Metadata Bar (All fonts >= 18px) -->
  <g transform="translate(60, 52)">
    <circle cx="6" cy="0" r="6" fill="#16A34A" class="pulse-dot"/>
    <text x="24" y="6" class="mono" font-size="18" font-weight="700" letter-spacing="2" fill="#0969DA">PEO051 // PROFILE</text>
    <text x="1080" y="6" text-anchor="end" class="mono" font-size="18" font-weight="600" fill="#64748B">HO CHI MINH CITY, VN</text>
    <line x1="0" y1="20" x2="1080" y2="20" stroke="#CBD5E1" stroke-width="1.2"/>
  </g>

  <!-- Left Main Content -->
  <g transform="translate(60, 140)">
    <!-- Name: 56px Bold -->
    <text x="0" y="0" class="sans" font-size="56" font-weight="800" fill="#0F172A" letter-spacing="-1">TRẦN DƯƠNG GIA BẢO</text>

    <!-- Roles: 32px / 26px -->
    <text x="0" y="52" class="sans" font-size="32" font-weight="700" fill="#0969DA">
      Software Engineering
      <tspan font-size="26" font-weight="600" fill="#334155"> · Applied AI · Research</tspan>
    </text>

    <!-- Description: 20px -->
    <text x="0" y="96" class="sans" font-size="20" font-weight="400" fill="#334155">
      Information Technology student building practical software systems and exploring applied AI.
    </text>

    <!-- Academic Meta: 19px -->
    <g transform="translate(0, 142)">
      <circle cx="6" cy="-6" r="4" fill="#0969DA"/>
      <text x="20" y="0" class="mono" font-size="19" font-weight="600" fill="#64748B">HUIT · Information Technology</text>
    </g>
  </g>

  <!-- Right Topology Flow (3 Large Minimal Nodes) -->
  <g transform="translate(800, 130)">
    <rect width="340" height="190" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Header -->
    <text x="24" y="38" class="mono" font-size="18" font-weight="700" letter-spacing="1.5" fill="#0969DA">SYSTEM FOCUS</text>

    <!-- Connectors -->
    <path d="M 68 114 L 140 114" class="flow-dash" stroke="#0969DA" stroke-width="2.5" fill="none"/>
    <path d="M 198 114 L 270 114" class="flow-dash" stroke="#0891B2" stroke-width="2.5" fill="none"/>

    <!-- Node 1: .NET -->
    <g transform="translate(24, 88)">
      <rect width="64" height="52" rx="10" fill="#EEF2FF" stroke="#0969DA" stroke-width="1.6"/>
      <text x="32" y="33" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#0F172A">.NET</text>
    </g>

    <!-- Node 2: AI -->
    <g transform="translate(140, 88)">
      <rect width="64" height="52" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
      <text x="32" y="33" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#0F172A">AI</text>
    </g>

    <!-- Node 3: R&amp;D -->
    <g transform="translate(252, 88)">
      <rect width="64" height="52" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
      <text x="32" y="33" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#0F172A">R&amp;D</text>
    </g>

    <text x="24" y="168" class="mono" font-size="18" font-weight="600" fill="#16A34A">ACTIVE DEVELOPMENT</text>
  </g>
</svg>