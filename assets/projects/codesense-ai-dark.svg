<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="CodeSense AI System Architecture">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif; }
      .flow-arrow { stroke-dasharray: 5 5; animation: dashMove 4s linear infinite; }
      @keyframes dashMove { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .flow-arrow { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="390" rx="18" fill="#07111F"/>
  <rect x="1" y="1" width="1198" height="388" rx="17" fill="none" stroke="#1E344A" stroke-width="1.5"/>

  <!-- Section Header -->
  <g transform="translate(48, 38)">
    <rect x="0" y="-18" width="118" height="24" rx="6" fill="#0E2A38" stroke="#22D3EE" stroke-width="1"/>
    <text x="59" y="-2" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#22D3EE">FLAGSHIP 01</text>
    
    <text x="136" y="0" class="sans" font-size="20" font-weight="800" fill="#F0F6FC">CodeSense AI</text>
    <text x="290" y="0" class="sans" font-size="15" font-weight="600" fill="#22D3EE">— Adaptive Programming Tutor</text>
    <text x="1104" y="0" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#71869A">REPO: Peo051/love-sense-ai</text>
    
    <text x="0" y="24" class="sans" font-size="13" font-weight="400" fill="#A8B8C7">
      Socratic tutoring workflow for beginner C# OOP learners: progressive hinting, AST analysis, and isolated student sessions.
    </text>
  </g>

  <!-- Architecture Pipeline Container -->
  <g transform="translate(48, 106)">
    <!-- 4 Pipeline Stages -->
    
    <!-- Stage 1: Student Client -->
    <g transform="translate(0, 0)">
      <rect width="230" height="165" rx="12" fill="#0D1A2B" stroke="#223B53" stroke-width="1.2"/>
      <rect x="0" y="0" width="230" height="32" rx="12" fill="#112235"/>
      <text x="14" y="21" class="mono" font-size="11" font-weight="700" fill="#58A6FF">01 // STUDENT CLIENT</text>
      
      <g transform="translate(14, 52)">
        <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#F0F6FC">Next.js 14 App Router</text>
        <text x="0" y="22" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• TypeScript + Tailwind CSS</text>
        <text x="0" y="42" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Code Editor Interface</text>
        <text x="0" y="62" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Progressive Hint UI</text>
        <text x="0" y="82" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Client-side State Cache</text>
      </g>
    </g>

    <!-- Connector 1 -> 2 -->
    <path d="M 230 82 L 278 82" class="flow-arrow" stroke="#22D3EE" stroke-width="2" fill="none"/>
    <polygon points="278,78 288,82 278,86" fill="#22D3EE"/>

    <!-- Stage 2: Backend Orchestrator -->
    <g transform="translate(288, 0)">
      <rect width="250" height="165" rx="12" fill="#0D1A2B" stroke="#223B53" stroke-width="1.2"/>
      <rect x="0" y="0" width="250" height="32" rx="12" fill="#0F2636"/>
      <text x="14" y="21" class="mono" font-size="11" font-weight="700" fill="#22D3EE">02 // BACKEND SERVICE</text>

      <g transform="translate(14, 52)">
        <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#F0F6FC">FastAPI REST Engine</text>
        <text x="0" y="22" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Async Python Runtime</text>
        <text x="0" y="42" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Session Lifecycle Manager</text>
        <text x="0" y="62" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Rate Limiting &amp; Sanitization</text>
        <text x="0" y="82" class="mono" font-size="11" font-weight="500" fill="#3FB950">• Firebase Auth Validator</text>
      </g>
    </g>

    <!-- Connector 2 -> 3 -->
    <path d="M 538 82 L 586 82" class="flow-arrow" stroke="#22D3EE" stroke-width="2" fill="none"/>
    <polygon points="586,78 596,82 586,86" fill="#22D3EE"/>

    <!-- Stage 3: AI Service &amp; LLM -->
    <g transform="translate(596, 0)">
      <rect width="250" height="165" rx="12" fill="#0D1A2B" stroke="#223B53" stroke-width="1.2"/>
      <rect x="0" y="0" width="250" height="32" rx="12" fill="#1C1B38"/>
      <text x="14" y="21" class="mono" font-size="11" font-weight="700" fill="#A78BFA">03 // AI TUTOR CORE</text>

      <g transform="translate(14, 52)">
        <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#F0F6FC">Socratic LLM Workflow</text>
        <text x="0" y="22" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• C# OOP Concept Mapper</text>
        <text x="0" y="42" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Prompt Scaffolding (No raw code)</text>
        <text x="0" y="62" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Error Diagnostic Prompting</text>
        <text x="0" y="82" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Response Guardrails</text>
      </g>
    </g>

    <!-- Connector 3 -> 4 -->
    <path d="M 846 82 L 894 82" class="flow-arrow" stroke="#22D3EE" stroke-width="2" fill="none"/>
    <polygon points="894,78 904,82 894,86" fill="#22D3EE"/>

    <!-- Stage 4: Evaluation &amp; Persistence -->
    <g transform="translate(904, 0)">
      <rect width="200" height="165" rx="12" fill="#0D1A2B" stroke="#223B53" stroke-width="1.2"/>
      <rect x="0" y="0" width="200" height="32" rx="12" fill="#13232C"/>
      <text x="14" y="21" class="mono" font-size="11" font-weight="700" fill="#3FB950">04 // EVAL &amp; DB</text>

      <g transform="translate(14, 52)">
        <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#F0F6FC">PostgreSQL Core</text>
        <text x="0" y="22" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• SQLAlchemy ORM</text>
        <text x="0" y="42" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• 3-Tier Progressive Hints</text>
        <text x="0" y="62" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Session History</text>
        <text x="0" y="82" class="mono" font-size="11" font-weight="500" fill="#3FB950">• Privacy Controls</text>
      </g>
    </g>
  </g>

  <!-- Bottom Signals Bar -->
  <g transform="translate(48, 305)">
    <rect width="1104" height="54" rx="10" fill="#0A1726" stroke="#223B53" stroke-width="1"/>
    
    <g transform="translate(20, 32)">
      <text x="0" y="0" class="mono" font-size="11" font-weight="700" fill="#22D3EE">SIGNALS // </text>
      <text x="76" y="0" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">Target: Beginner C# OOP</text>
      <text x="250" y="0" class="mono" font-size="11" fill="#71869A">|</text>
      <text x="270" y="0" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">Method: Socratic Guidance (No direct code answer)</text>
      <text x="640" y="0" class="mono" font-size="11" fill="#71869A">|</text>
      <text x="660" y="0" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">Deployment: Vercel (Front) + Render (API)</text>
    </g>
  </g>
</svg>