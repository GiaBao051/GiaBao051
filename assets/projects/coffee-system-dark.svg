<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Coffee Shop Management System Architecture">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif; }
      .flow-arrow { stroke-dasharray: 5 5; animation: dashMove2 4s linear infinite; }
      @keyframes dashMove2 { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .flow-arrow { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="390" rx="18" fill="#07111F"/>
  <rect x="1" y="1" width="1198" height="388" rx="17" fill="none" stroke="#1E344A" stroke-width="1.5"/>

  <!-- Section Header -->
  <g transform="translate(48, 38)">
    <rect x="0" y="-18" width="118" height="24" rx="6" fill="#132338" stroke="#58A6FF" stroke-width="1"/>
    <text x="59" y="-2" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#58A6FF">FLAGSHIP 02</text>
    
    <text x="136" y="0" class="sans" font-size="20" font-weight="800" fill="#F0F6FC">Coffee Shop Management System</text>
    <text x="510" y="0" class="sans" font-size="15" font-weight="600" fill="#58A6FF">— Desktop POS &amp; Payment Service</text>
    <text x="1104" y="0" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#71869A">REPO: Peo051/Coffee_Shop_Management_WPF</text>
    
    <text x="0" y="24" class="sans" font-size="13" font-weight="400" fill="#A8B8C7">
      WPF (.NET 8) desktop client with MVVM architecture, Dapper ORM, SQL Server, and ASP.NET Core PayOS VietQR payment webhook integration.
    </text>
  </g>

  <!-- Architecture 3-Column Layout -->
  <g transform="translate(48, 106)">
    <!-- Column 1: WPF Desktop Client -->
    <g transform="translate(0, 0)">
      <rect width="360" height="165" rx="12" fill="#0D1A2B" stroke="#223B53" stroke-width="1.2"/>
      <rect x="0" y="0" width="360" height="32" rx="12" fill="#112235"/>
      <text x="16" y="21" class="mono" font-size="11" font-weight="700" fill="#58A6FF">01 // WPF DESKTOP CLIENT (.NET 8)</text>

      <g transform="translate(16, 52)">
        <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#F0F6FC">MVVM Client Layer</text>
        <text x="0" y="22" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Views (XAML Desktop UI, POS, Tables, Staff)</text>
        <text x="0" y="42" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• ViewModels (INotifyPropertyChanged, Commands)</text>
        <text x="0" y="62" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Services (Shift Reconcile, Inventory, Recipes)</text>
        <text x="0" y="82" class="mono" font-size="11" font-weight="500" fill="#58A6FF">• Repositories (Dapper Micro-ORM Access)</text>
      </g>
    </g>

    <!-- Connector 1 <-> 2 -->
    <path d="M 360 82 L 418 82" class="flow-arrow" stroke="#58A6FF" stroke-width="2" fill="none"/>
    <polygon points="418,78 428,82 418,86" fill="#58A6FF"/>

    <!-- Column 2: SQL Server Database -->
    <g transform="translate(428, 0)">
      <rect width="250" height="165" rx="12" fill="#0D1A2B" stroke="#223B53" stroke-width="1.2"/>
      <rect x="0" y="0" width="250" height="32" rx="12" fill="#142533"/>
      <text x="16" y="21" class="mono" font-size="11" font-weight="700" fill="#3FB950">02 // SQL SERVER DB</text>

      <g transform="translate(16, 52)">
        <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#F0F6FC">Relational Schema</text>
        <text x="0" y="22" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Orders &amp; Invoices Ledger</text>
        <text x="0" y="42" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Real-time Inventory Deduct</text>
        <text x="0" y="62" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Customer Loyalty Points</text>
        <text x="0" y="82" class="mono" font-size="11" font-weight="500" fill="#3FB950">• Shift Cash Reconciliation</text>
      </g>
    </g>

    <!-- Connector 2 <-> 3 -->
    <path d="M 678 82 L 736 82" class="flow-arrow" stroke="#58A6FF" stroke-width="2" fill="none"/>
    <polygon points="736,78 746,82 736,86" fill="#58A6FF"/>

    <!-- Column 3: Payment Service &amp; Webhook -->
    <g transform="translate(746, 0)">
      <rect width="358" height="165" rx="12" fill="#0D1A2B" stroke="#223B53" stroke-width="1.2"/>
      <rect x="0" y="0" width="358" height="32" rx="12" fill="#102835"/>
      <text x="16" y="21" class="mono" font-size="11" font-weight="700" fill="#58A6FF">03 // PAYMENT API &amp; VIETQR</text>

      <g transform="translate(16, 52)">
        <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#F0F6FC">ASP.NET Core Web API</text>
        <text x="0" y="22" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• PayOS SDK Integration (VietQR dynamic gen)</text>
        <text x="0" y="42" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Webhook Listener for real-time payment</text>
        <text x="0" y="62" class="mono" font-size="11" font-weight="500" fill="#3FB950">• HMAC-SHA256 Signature Verification</text>
        <text x="0" y="82" class="mono" font-size="11" font-weight="500" fill="#A8B8C7">• Automatic Order State Transition to Paid</text>
      </g>
    </g>
  </g>

  <!-- Bottom Signals Bar -->
  <g transform="translate(48, 305)">
    <rect width="1104" height="54" rx="10" fill="#0A1726" stroke="#223B53" stroke-width="1"/>
    
    <g transform="translate(20, 32)">
      <text x="0" y="0" class="mono" font-size="11" font-weight="700" fill="#58A6FF">FEATURES // </text>
      <text x="86" y="0" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">POS Quầy</text>
      <text x="160" y="0" class="mono" font-size="11" fill="#71869A">·</text>
      <text x="175" y="0" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">Kho &amp; Định lượng</text>
      <text x="290" y="0" class="mono" font-size="11" fill="#71869A">·</text>
      <text x="305" y="0" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">Khách hàng &amp; Điểm</text>
      <text x="445" y="0" class="mono" font-size="11" fill="#71869A">·</text>
      <text x="460" y="0" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">Khuyến mãi linh hoạt</text>
      <text x="610" y="0" class="mono" font-size="11" fill="#71869A">·</text>
      <text x="625" y="0" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">Đối soát ca làm</text>
      <text x="735" y="0" class="mono" font-size="11" fill="#71869A">·</text>
      <text x="750" y="0" class="sans" font-size="12" font-weight="600" fill="#3FB950">Thanh toán PayOS VietQR Webhook</text>
    </g>
  </g>
</svg>