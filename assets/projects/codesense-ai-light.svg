<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="CodeSense AI System Architecture">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif; }
      .flow-arrow { stroke-dasharray: 5 5; animation: dashMove 4s linear infinite; }
      @keyframes dashMove { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .flow-arrow { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="390" rx="18" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="388" rx="17" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Section Header -->
  <g transform="translate(48, 38)">
    <rect x="0" y="-18" width="118" height="24" rx="6" fill="#E0F2FE" stroke="#0891B2" stroke-width="1"/>
    <text x="59" y="-2" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#0891B2">FLAGSHIP 01</text>
    
    <text x="136" y="0" class="sans" font-size="20" font-weight="800" fill="#0F172A">CodeSense AI</text>
    <text x="290" y="0" class="sans" font-size="15" font-weight="600" fill="#0891B2">— Adaptive Programming Tutor</text>
    <text x="1104" y="0" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#64748B">REPO: Peo051/love-sense-ai</text>
    
    <text x="0" y="24" class="sans" font-size="13" font-weight="400" fill="#334155">
      Socratic tutoring workflow for beginner C# OOP learners: progressive hinting, AST analysis, and isolated student sessions.
    </text>
  </g>

  <!-- Architecture Pipeline Container -->
  <g transform="translate(48, 106)">
    <!-- 4 Pipeline Stages -->
    
    <!-- Stage 1: Student Client -->
    <g transform="translate(0, 0)">
      <rect width="230" height="165" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="0" y="0" width="230" height="32" rx="12" fill="#F1F5F9"/>
      <text x="14" y="21" class="mono" font-size="11" font-weight="700" fill="#0969DA">01 // STUDENT CLIENT</text>
      
      <g transform="translate(14, 52)">
        <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#0F172A">Next.js 14 App Router</text>
        <text x="0" y="22" class="mono" font-size="11" font-weight="500" fill="#334155">• TypeScript + Tailwind CSS</text>
        <text x="0" y="42" class="mono" font-size="11" font-weight="500" fill="#334155">• Code Editor Interface</text>
        <text x="0" y="62" class="mono" font-size="11" font-weight="500" fill="#334155">• Progressive Hint UI</text>
        <text x="0" y="82" class="mono" font-size="11" font-weight="500" fill="#334155">• Client-side State Cache</text>
      </g>
    </g>

    <!-- Connector 1 -> 2 -->
    <path d="M 230 82 L 278 82" class="flow-arrow" stroke="#0891B2" stroke-width="2" fill="none"/>
    <polygon points="278,78 288,82 278,86" fill="#0891B2"/>

    <!-- Stage 2: Backend Orchestrator -->
    <g transform="translate(288, 0)">
      <rect width="250" height="165" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="0" y="0" width="250" height="32" rx="12" fill="#F0FDFA"/>
      <text x="14" y="21" class="mono" font-size="11" font-weight="700" fill="#0891B2">02 // BACKEND SERVICE</text>

      <g transform="translate(14, 52)">
        <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#0F172A">FastAPI REST Engine</text>
        <text x="0" y="22" class="mono" font-size="11" font-weight="500" fill="#334155">• Async Python Runtime</text>
        <text x="0" y="42" class="mono" font-size="11" font-weight="500" fill="#334155">• Session Lifecycle Manager</text>
        <text x="0" y="62" class="mono" font-size="11" font-weight="500" fill="#334155">• Rate Limiting &amp; Sanitization</text>
        <text x="0" y="82" class="mono" font-size="11" font-weight="500" fill="#16A34A">• Firebase Auth Validator</text>
      </g>
    </g>

    <!-- Connector 2 -> 3 -->
    <path d="M 538 82 L 586 82" class="flow-arrow" stroke="#0891B2" stroke-width="2" fill="none"/>
    <polygon points="586,78 596,82 586,86" fill="#0891B2"/>

    <!-- Stage 3: AI Service &amp; LLM -->
    <g transform="translate(596, 0)">
      <rect width="250" height="165" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="0" y="0" width="250" height="32" rx="12" fill="#F5F3FF"/>
      <text x="14" y="21" class="mono" font-size="11" font-weight="700" fill="#7C3AED">03 // AI TUTOR CORE</text>

      <g transform="translate(14, 52)">
        <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#0F172A">Socratic LLM Workflow</text>
        <text x="0" y="22" class="mono" font-size="11" font-weight="500" fill="#334155">• C# OOP Concept Mapper</text>
        <text x="0" y="42" class="mono" font-size="11" font-weight="500" fill="#334155">• Prompt Scaffolding (No raw code)</text>
        <text x="0" y="62" class="mono" font-size="11" font-weight="500" fill="#334155">• Error Diagnostic Prompting</text>
        <text x="0" y="82" class="mono" font-size="11" font-weight="500" fill="#334155">• Response Guardrails</text>
      </g>
    </g>

    <!-- Connector 3 -> 4 -->
    <path d="M 846 82 L 894 82" class="flow-arrow" stroke="#0891B2" stroke-width="2" fill="none"/>
    <polygon points="894,78 904,82 894,86" fill="#0891B2"/>

    <!-- Stage 4: Evaluation &amp; Persistence -->
    <g transform="translate(904, 0)">
      <rect width="200" height="165" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="0" y="0" width="200" height="32" rx="12" fill="#F0FDF4"/>
      <text x="14" y="21" class="mono" font-size="11" font-weight="700" fill="#16A34A">04 // EVAL &amp; DB</text>

      <g transform="translate(14, 52)">
        <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#0F172A">PostgreSQL Core</text>
        <text x="0" y="22" class="mono" font-size="11" font-weight="500" fill="#334155">• SQLAlchemy ORM</text>
        <text x="0" y="42" class="mono" font-size="11" font-weight="500" fill="#334155">• 3-Tier Progressive Hints</text>
        <text x="0" y="62" class="mono" font-size="11" font-weight="500" fill="#334155">• Session History</text>
        <text x="0" y="82" class="mono" font-size="11" font-weight="500" fill="#16A34A">• Privacy Controls</text>
      </g>
    </g>
  </g>

  <!-- Bottom Signals Bar -->
  <g transform="translate(48, 305)">
    <rect width="1104" height="54" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    
    <g transform="translate(20, 32)">
      <text x="0" y="0" class="mono" font-size="11" font-weight="700" fill="#0891B2">SIGNALS // </text>
      <text x="76" y="0" class="sans" font-size="12" font-weight="600" fill="#0F172A">Target: Beginner C# OOP</text>
      <text x="250" y="0" class="mono" font-size="11" fill="#64748B">|</text>
      <text x="270" y="0" class="sans" font-size="12" font-weight="600" fill="#0F172A">Method: Socratic Guidance (No direct code answer)</text>
      <text x="640" y="0" class="mono" font-size="11" fill="#64748B">|</text>
      <text x="660" y="0" class="sans" font-size="12" font-weight="600" fill="#0F172A">Deployment: Vercel (Front) + Render (API)</text>
    </g>
  </g>
</svg>