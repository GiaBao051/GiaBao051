<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Trần Dương Gia Bảo engineering profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340">
      <stop stop-color="#06101D"/>
      <stop offset=".58" stop-color="#091827"/>
      <stop offset="1" stop-color="#0A202A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#58A6FF"/>
      <stop offset=".48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".92"/>
      <stop offset=".28" stop-color="#22D3EE" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#15304A" opacity=".34"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .name { font: 750 45px Inter, Segoe UI, Arial, sans-serif; fill: #F7FBFF; }
      .role { font: 500 22px Inter, Segoe UI, Arial, sans-serif; fill: #D2E4F3; }
      .eyebrow { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2.3px; fill: #58A6FF; }
      .small { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7890A6; }
      .node { animation: node 2.8s ease-in-out infinite; transform-origin:center; }
      .node2 { animation-delay:.8s }
      .node3 { animation-delay:1.6s }
      .flow { stroke-dasharray: 9 10; animation: flow 3.6s linear infinite; }
      .cursor { animation: blink 1.05s step-end infinite; }
      .scan { animation: scan 8s linear infinite; }
      @keyframes node { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes flow { to { stroke-dashoffset:-38 } }
      @keyframes blink { 0%,45% { opacity:1 } 46%,100% { opacity:0 } }
      @keyframes scan { from { transform:translateX(-260px) } to { transform:translateX(1280px) } }
      @media (prefers-reduced-motion: reduce) {
        .node,.flow,.cursor,.scan { animation:none; }
      }
    </style>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="25" fill="none" stroke="#223A52" stroke-width="2"/>
  <rect width="1200" height="340" rx="26" fill="url(#grid)"/>

  <g class="scan" opacity=".32">
    <rect x="-220" y="0" width="220" height="340" fill="url(#accent)" opacity=".045"/>
    <line x1="0" y1="18" x2="0" y2="322" stroke="#22D3EE"/>
  </g>

  <circle cx="66" cy="46" r="5.5" fill="#FF6B6B"/>
  <circle cx="87" cy="46" r="5.5" fill="#F7C948"/>
  <circle cx="108" cy="46" r="5.5" fill="#38D996"/>
  <text x="136" y="51" class="small">peo051://engineering-profile</text>
  <text x="1090" y="51" class="small">v2026.09</text>

  <rect x="62" y="88" width="7" height="159" rx="3.5" fill="url(#accent)"/>

  <text x="92" y="116" class="eyebrow">TRẦN DƯƠNG GIA BẢO</text>
  <text x="92" y="166" class="name">Software Engineering</text>
  <text x="92" y="205" class="role">Applied AI × Research</text>
  <text x="92" y="249" class="small">build systems · study algorithms · measure what matters<tspan class="cursor">_</tspan></text>

  <g transform="translate(820 88)">
    <rect width="315" height="180" rx="18" fill="#08131F" stroke="#20384D"/>
    <text x="24" y="32" class="eyebrow">SYSTEM MAP</text>

    <path d="M70 92H150M164 92H242" class="flow" stroke="url(#accent)" stroke-width="2" fill="none"/>
    <path d="M156 101V140" class="flow" stroke="#A78BFA" stroke-width="2" fill="none"/>

    <circle cx="56" cy="92" r="28" fill="url(#orb)" class="node"/>
    <circle cx="156" cy="92" r="28" fill="url(#orb)" class="node node2"/>
    <circle cx="256" cy="92" r="28" fill="url(#orb)" class="node node3"/>
    <circle cx="156" cy="151" r="20" fill="url(#orb)" class="node node2"/>

    <circle cx="56" cy="92" r="5" fill="#58A6FF"/>
    <circle cx="156" cy="92" r="5" fill="#22D3EE"/>
    <circle cx="256" cy="92" r="5" fill="#A78BFA"/>
    <circle cx="156" cy="151" r="4" fill="#3FB950"/>

    <text x="35" y="132" class="small">.NET</text>
    <text x="136" y="132" class="small">AI</text>
    <text x="231" y="132" class="small">R&amp;D</text>
  </g>

  <path d="M62 292H1138" stroke="#193148"/>
  <circle cx="68" cy="309" r="4" fill="#3FB950" class="node"/>
  <text x="82" y="313" class="small">HUIT · Information Technology · Ho Chi Minh City</text>
  <text x="893" y="313" class="small">GitHub / Peo051</text>
</svg>
