<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Engineering DNA &amp; Capability Architecture">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif; }
      .dna-line { stroke-dasharray: 4 4; }
    </style>
  </defs>

  <!-- Frame Base -->
  <rect width="1200" height="320" rx="18" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="700" letter-spacing="2" fill="#0969DA">01 // ARCHITECTURAL DNA</text>
    <text x="210" y="0" class="mono" font-size="11" font-weight="500" fill="#64748B">RELATIONSHIP MATRIX · NOT JUST A SKILL WALL</text>
  </g>

  <!-- Central Root: Software Engineering -->
  <g transform="translate(470, 70)">
    <rect width="260" height="54" rx="12" fill="#FFFFFF" stroke="#0969DA" stroke-width="1.8"/>
    <text x="130" y="25" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#0F172A">SOFTWARE ENGINEERING</text>
    <text x="130" y="42" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#0969DA">.NET 8 · APIs · Relational Databases</text>
  </g>

  <!-- Trunk Connector Lines -->
  <path d="M 600 124 L 600 148" stroke="#CBD5E1" stroke-width="2" fill="none"/>
  <path d="M 270 148 L 930 148" stroke="#CBD5E1" stroke-width="2" fill="none"/>
  <path d="M 270 148 L 270 174" stroke="#0891B2" stroke-width="2" fill="none"/>
  <path d="M 930 148 L 930 174" stroke="#7C3AED" stroke-width="2" fill="none"/>

  <!-- Left Pillar: Product Systems &amp; Applied AI -->
  <g transform="translate(80, 174)">
    <rect width="380" height="108" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="108" rx="3" fill="#0891B2"/>
    
    <g transform="translate(24, 26)">
      <text x="0" y="0" class="sans" font-size="14" font-weight="700" fill="#0F172A">PRODUCT SYSTEMS &amp; APPLIED AI</text>
      <text x="0" y="20" class="mono" font-size="11" font-weight="600" fill="#0891B2">Desktop POS &amp; Adaptive Tutoring</text>
      <text x="0" y="44" class="sans" font-size="12" font-weight="400" fill="#334155">• Next.js + FastAPI + LLM Orchestration (CodeSense AI)</text>
      <text x="0" y="64" class="sans" font-size="12" font-weight="400" fill="#334155">• WPF Desktop + ASP.NET Core API + VietQR PayOS</text>
    </g>
  </g>

  <!-- Center Connecting Bridge -->
  <g transform="translate(480, 196)">
    <rect width="240" height="64" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="120" y="26" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#16A34A">SYSTEMATIC RIGOR</text>
    <text x="120" y="44" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#64748B">Design Patterns ⇄ Data Structures</text>
  </g>

  <!-- Right Pillar: Data Systems &amp; Research -->
  <g transform="translate(740, 174)">
    <rect width="380" height="108" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="374" y="0" width="6" height="108" rx="3" fill="#7C3AED"/>

    <g transform="translate(24, 26)">
      <text x="0" y="0" class="sans" font-size="14" font-weight="700" fill="#0F172A">DATA MINING &amp; RESEARCH</text>
      <text x="0" y="20" class="mono" font-size="11" font-weight="600" fill="#7C3AED">High-Utility Itemset Mining (HUIM)</text>
      <text x="0" y="44" class="sans" font-size="12" font-weight="400" fill="#334155">• Utility-Lists, Search-Space Pruning &amp; Taxonomy</text>
      <text x="0" y="64" class="sans" font-size="12" font-weight="400" fill="#334155">• HUIMiner, CLHMiner, FEACP Algorithm Benchmarks</text>
    </g>
  </g>
</svg>