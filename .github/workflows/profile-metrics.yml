name: Refresh profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
      timezone: "Asia/Ho_Chi_Minh"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Render live profile metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: Peo051
        run: node scripts/render-profile.mjs

      - name: Commit generated visuals
        shell: bash
        run: |
          if git diff --quiet -- assets/generated; then
            echo "No profile metric changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/generated
          git commit -m "chore(profile): refresh dynamic visuals [skip ci]"
          git push
